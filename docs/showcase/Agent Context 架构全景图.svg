<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景与网格 -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    
    <linearGradient id="grad-system" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-memory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7E22CE;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-history" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- 深色背景 -->
  <rect width="1000" height="650" fill="#111111" />
  <rect width="1000" height="650" fill="url(#grid)" />

  <!-- 标题部分 -->
  <text x="50" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="2">AGENT CONTEXT 架构全景图</text>
  <text x="50" y="90" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="400">面向 LLM 通信的全局上下文流转与组装过程</text>

  <!-- 左侧：输入源 -->
  <!-- 1. 系统上下文 -->
  <g transform="translate(60, 150)">
    <rect width="240" height="80" rx="12" fill="url(#grad-system)" filter="url(#glow)" opacity="0.9" />
    <path d="M20 30h20v20H20zm5 5h10v10H25z" fill="#FFF" opacity="0.8"/>
    <text x="55" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">系统上下文 (System)</text>
    <text x="55" y="58" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" opacity="0.8">核心指令、角色定义、安全规则</text>
  </g>

  <!-- 2. 持久化记忆 -->
  <g transform="translate(60, 260)">
    <rect width="240" height="80" rx="12" fill="url(#grad-memory)" filter="url(#glow)" opacity="0.9" />
    <path d="M20 30h20v20H20z" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8"/>
    <path d="M25 35h10M25 40h10M25 45h10" stroke="#FFF" stroke-width="2" opacity="0.8"/>
    <text x="55" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">持久化记忆 (Memory)</text>
    <text x="55" y="58" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" opacity="0.8">GEMINI.md、全局偏好、知识库</text>
  </g>

  <!-- 3. 工作记忆 -->
  <g transform="translate(60, 370)">
    <rect width="240" height="80" rx="12" fill="url(#grad-history)" filter="url(#glow)" opacity="0.9" />
    <circle cx="30" cy="40" r="10" stroke="#FFF" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M30 35v5h5" stroke="#FFF" stroke-width="2" fill="none" opacity="0.8"/>
    <text x="55" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">工作记忆 (Working)</text>
    <text x="55" y="58" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" opacity="0.8">短期对话历史、会话状态</text>
  </g>

  <!-- 4. 即时输入 -->
  <g transform="translate(60, 480)">
    <rect width="240" height="80" rx="12" fill="url(#grad-user)" filter="url(#glow)" opacity="0.9" />
    <path d="M20 40l10-10 10 10-10 10z" fill="#FFF" opacity="0.8"/>
    <text x="55" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">即时输入 (Real-time)</text>
    <text x="55" y="58" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" opacity="0.8">用户提示词、Hook 数据、当前环境变量</text>
  </g>

  <!-- 中间：组装器 -->
  <g transform="translate(450, 275)">
    <path d="M0,0 L100,-50 L100,100 L0,150 Z" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <path d="M100,-50 L150,0 L150,150 L100,100 Z" fill="#0F172A" stroke="#475569" stroke-width="2" />
    <text x="75" y="65" text-anchor="middle" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="14" font-weight="800" transform="rotate(-25, 75, 65)">上下文组装器</text>
    <!-- 组装器内部发光 -->
    <rect x="40" y="30" width="70" height="70" fill="#22D3EE" opacity="0.1" filter="url(#glow)" />
  </g>

  <!-- 右侧：最终上下文 Payload -->
  <g transform="translate(700, 200)">
    <rect width="240" height="300" rx="16" fill="#1E293B" stroke="#22D3EE" stroke-width="3" filter="url(#glow)" opacity="0.8" />
    <text x="120" y="40" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">最终上下文窗口</text>
    <line x1="40" y1="60" x2="200" y2="60" stroke="#22D3EE" stroke-width="1" opacity="0.3"/>
    
    <!-- Payload 数据块 -->
    <rect x="30" y="80" width="180" height="40" rx="4" fill="#3B82F6" opacity="0.4" />
    <text x="40" y="105" fill="#FFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">系统提示词 (System)</text>
    
    <rect x="30" y="130" width="180" height="40" rx="4" fill="#A855F7" opacity="0.4" />
    <text x="40" y="155" fill="#FFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">知识库/持久记忆 (Memory)</text>
    
    <rect x="30" y="180" width="180" height="60" rx="4" fill="#10B981" opacity="0.4" />
    <text x="40" y="215" fill="#FFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">对话历史 (Chat History)</text>
    
    <rect x="30" y="250" width="180" height="30" rx="4" fill="#F59E0B" opacity="0.4" />
    <text x="40" y="270" fill="#FFF" font-family="system-ui, sans-serif" font-size="11" font-weight="600">当前用户请求 (Query)</text>

    <text x="120" y="330" text-anchor="middle" fill="#22D3EE" font-family="system-ui, sans-serif" font-size="14" font-weight="700">发送至大模型进行推理</text>
  </g>

  <!-- 连接线 -->
  <!-- 从输入源到组装器 -->
  <path d="M300,190 C380,190 400,325 450,325" fill="none" stroke="url(#grad-system)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)" />
  <path d="M300,300 C380,300 400,350 450,350" fill="none" stroke="url(#grad-memory)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)" />
  <path d="M300,410 C380,410 400,375 450,375" fill="none" stroke="url(#grad-history)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)" />
  <path d="M300,520 C380,520 400,400 450,400" fill="none" stroke="url(#grad-user)" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow)" />

  <!-- 从组装器到最终 Payload -->
  <path d="M600,350 C650,350 670,350 700,350" fill="none" stroke="#22D3EE" stroke-width="4" filter="url(#glow)" marker-end="url(#arrow)" />

  <!-- 注解部分 -->
  <rect x="420" y="550" width="540" height="60" rx="8" fill="#1E293B" opacity="0.6" />
  <text x="440" y="575" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">
    <tspan x="440" dy="0">· 组装器在生成 Payload 前执行“指令注入”与“上下文裁剪”。</tspan>
    <tspan x="440" dy="18">· 上下文窗口管理负责 Token 优化、优先级排布与结构化序列化。</tspan>
  </text>

</svg>