    <text x="734" y="212" text-anchor="middle" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#E8B878" data-svga-color-role="text_amber" data-svga-text="p3-role">规则校验与拦截</text>
