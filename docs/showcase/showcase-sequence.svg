          fill="#7DD3A8" data-svga-color-role="text_green" data-svga-text="p4-role">只读索引与工作区</text>
  </g>

  <path d="M 206 274 L 460 274" fill="none" stroke="#71717A" stroke-width="2.5"
        marker-end="url(#svga-showcase-sequence-arrow-neutral)"
        data-svga-edge="m-1" data-svga-role="edge" data-svga-color-role="edge_neutral"/>
  <text x="333" y="260" text-anchor="middle" font-size="16" font-weight="600"
