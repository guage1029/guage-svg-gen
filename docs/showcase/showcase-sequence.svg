          fill="#8FA1D9" data-svga-color-role="text_blue" data-svga-text="p2-role">规划与工具调度</text>
  </g>

  <g id="svga-showcase-sequence-p-gateway" data-svga-node="p-gateway">
    <rect x="634" y="154" width="200" height="72" rx="10" fill="#111114" data-svga-color-role="node"/>
    <rect x="634" y="154" width="200" height="72" rx="10" fill="#261E12" stroke="#D9A25F" stroke-width="1.5" data-svga-color-role="node_amber"/>
    <text x="734" y="186" text-anchor="middle" font-size="20" font-weight="700"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
