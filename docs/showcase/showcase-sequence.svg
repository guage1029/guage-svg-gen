        data-svga-edge="m-3" data-svga-role="edge" data-svga-color-role="edge_green"/>
  <text x="867" y="368" text-anchor="middle" font-size="16" font-weight="600"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#7DD3A8" data-svga-color-role="text_green" data-svga-text="m3-lbl">放行只读检索白名单</text>

  <path d="M 994 436 L 472 436" fill="none" stroke="#7DD3A8" stroke-width="2" stroke-dasharray="5,5"
        marker-end="url(#svga-showcase-sequence-arrow-green)"
        data-svga-edge="m-4" data-svga-role="edge" data-svga-color-role="edge_green"/>
  <text x="867" y="422" text-anchor="middle" font-size="16" font-weight="600"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#7DD3A8" data-svga-color-role="text_green" data-svga-text="m4-lbl">回传只读片段与符号树</text>

  <path d="M 728 490 L 206 490" fill="none" stroke="#E38B94" stroke-width="2" stroke-dasharray="5,5"
        marker-end="url(#svga-showcase-sequence-arrow-danger)"
        data-svga-edge="m-5" data-svga-role="edge" data-svga-color-role="edge_danger"/>
  <text x="600" y="476" text-anchor="middle" font-size="16" font-weight="600"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#E38B94" data-svga-color-role="text_danger" data-svga-text="m5-lbl">高危越界操作触发熔断</text>

  <path d="M 460 544 L 206 544" fill="none" stroke="#8FA1D9" stroke-width="2" stroke-dasharray="5,5"
        marker-end="url(#svga-showcase-sequence-arrow-blue)"
        data-svga-edge="m-6" data-svga-role="edge" data-svga-color-role="edge_flow"/>
  <text x="333" y="530" text-anchor="middle" font-size="16" font-weight="600"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#8FA1D9" data-svga-color-role="text_blue" data-svga-text="m6-lbl">流式交付验证后补丁</text>

  <g id="svga-showcase-sequence-legend">
    <line x1="148" y1="600" x2="184" y2="600" stroke="#8FA1D9" stroke-width="2.5" data-svga-role="decoration" data-svga-color-role="edge_flow"/>
    <text x="192" y="606" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#A1A1AA" data-svga-color-role="text_muted" data-svga-text="legend-1">主控调度与交付</text>

    <line x1="344" y1="600" x2="380" y2="600" stroke="#7DD3A8" stroke-width="2.5" stroke-dasharray="5,5" data-svga-role="decoration" data-svga-color-role="edge_green"/>
    <text x="388" y="606" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#A1A1AA" data-svga-color-role="text_muted" data-svga-text="legend-2">安全放行与结果回传</text>

    <line x1="562" y1="600" x2="598" y2="600" stroke="#E38B94" stroke-width="2.5" stroke-dasharray="5,5" data-svga-role="decoration" data-svga-color-role="edge_danger"/>
    <text x="606" y="606" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#A1A1AA" data-svga-color-role="text_muted" data-svga-text="legend-3">高危越界熔断拦截</text>

    <rect x="794" y="592" width="22" height="16" rx="4" fill="#050506" stroke="#52525B" stroke-width="1.2" data-svga-role="decoration" data-svga-color-role="border_mid"/>
    <text x="824" y="606" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#A1A1AA" data-svga-color-role="text_muted" data-svga-text="legend-4">纯平暗底消除生命线干扰</text>
