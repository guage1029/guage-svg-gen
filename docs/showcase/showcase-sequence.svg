    <text x="1000" y="186" text-anchor="middle" font-size="20" font-weight="700"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#FAFAFA" data-svga-color-role="text_primary" data-svga-text="p4-title">受限代码仓库</text>
    <text x="1000" y="212" text-anchor="middle" font-size="16" font-weight="400"
