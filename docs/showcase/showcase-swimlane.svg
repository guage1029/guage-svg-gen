  <!-- External Legend -->
  <g id="svga-showcase-swimlane-legend">
    <line x1="116" y1="614" x2="152" y2="614" stroke="#4D5E9E" stroke-width="2.5" data-svga-role="decoration" data-svga-color-role="edge_flow"/>
    <text x="160" y="620" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-1">智能体正向流转</text>

    <line x1="336" y1="614" x2="372" y2="614" stroke="#387D64" stroke-width="2.5" data-svga-role="decoration" data-svga-color-role="edge_green"/>
    <text x="380" y="620" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-2">门禁通过并跨道交付</text>

    <line x1="566" y1="614" x2="602" y2="614" stroke="#B2565E" stroke-width="2.2" stroke-dasharray="5,5" data-svga-role="decoration" data-svga-color-role="edge_danger"/>
    <text x="610" y="620" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-3">失败拦截并自愈回炉</text>

    <rect x="810" y="606" width="24" height="16" rx="4" fill="#F7F5F0" stroke="#A8A29E" stroke-width="1.2" stroke-dasharray="4,2" data-svga-role="decoration" data-svga-color-role="border_mid"/>
    <text x="844" y="620" text-anchor="start" font-size="16" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-4">三角色泳道 · 纯平暖纸底</text>
  </g>
</svg>
