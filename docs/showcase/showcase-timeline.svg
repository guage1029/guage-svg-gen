    <text x="890" y="298" font-size="20" font-weight="700" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#09090B" data-svga-color-role="text_primary" data-svga-text="m4-title">规范驱动长程交付</text>
    <text x="890" y="332" font-size="17" font-weight="600" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#7F5420" data-svga-color-role="text_amber" data-svga-text="m4-sub">技能沉淀与沙箱严格门禁</text>
    <line x1="890" y1="344" x2="1090" y2="344" stroke="#CCC7BD" stroke-width="1" data-svga-color-role="border"/>
    <text x="890" y="376" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m4-b1">· 模块化技能按需动态装载</text>
    <text x="890" y="418" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
