    <text x="890" y="460" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m4-b3">· 跨会话可验证生产交付</text>
  </g>

  <g id="svga-showcase-timeline-legend">
    <line x1="146" y1="598" x2="182" y2="598" stroke="#78716C" stroke-width="2.5" data-svga-role="decoration" data-svga-color-role="edge_neutral"/>
    <text x="190" y="604" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-1">补全演进链</text>

    <line x1="366" y1="598" x2="402" y2="598" stroke="#4D5E9E" stroke-width="2.5" data-svga-role="decoration" data-svga-color-role="edge_flow"/>
    <text x="410" y="604" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-2">协作跃迁推演</text>

    <line x1="606" y1="598" x2="642" y2="598" stroke="#387D64" stroke-width="2.5" data-svga-role="decoration" data-svga-color-role="edge_green"/>
    <text x="650" y="604" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-3">工具赋能落地</text>

    <text x="860" y="604" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="legend-4">蓝图网格：40 像素淡线</text>
