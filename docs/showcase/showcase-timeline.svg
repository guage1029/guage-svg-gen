    <rect x="110" y="234" width="136" height="28" rx="14" fill="#EFECE4" stroke="#A8A29E" stroke-width="1" data-svga-color-role="badge_neutral"/>
    <text x="178" y="253" text-anchor="middle" font-size="16" font-weight="600"
