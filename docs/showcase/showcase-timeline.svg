    <rect x="630" y="234" width="136" height="28" rx="14" fill="#E9F5EF" stroke="#387D64" stroke-width="1" data-svga-color-role="badge_green"/>
    <text x="698" y="253" text-anchor="middle" font-size="16" font-weight="600"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#2A634E" data-svga-color-role="text_green" data-svga-text="m3-badge">2024 · 工具期</text>
    <text x="630" y="298" font-size="20" font-weight="700" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#09090B" data-svga-color-role="text_primary" data-svga-text="m3-title">自主编排与命令</text>
    <text x="630" y="332" font-size="17" font-weight="600" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#2A634E" data-svga-color-role="text_green" data-svga-text="m3-sub">读写文件加终端自测闭环</text>
    <line x1="630" y1="344" x2="830" y2="344" stroke="#CCC7BD" stroke-width="1" data-svga-color-role="border"/>
    <text x="630" y="376" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m3-b1">· 自主检索、改写与单测</text>
    <text x="630" y="418" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m3-b2">· 依据终端报错自动纠偏</text>
    <text x="630" y="460" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m3-b3">· 工具协议生态快速收敛</text>
  </g>

  <g id="svga-showcase-timeline-m4" data-svga-node="m-4">
    <rect x="876" y="218" width="228" height="308" rx="10" fill="#FFFFFF" stroke="#9C6B30" stroke-width="1.5" data-svga-color-role="node"/>
    <rect x="890" y="234" width="136" height="28" rx="14" fill="#FBF4E9" stroke="#9C6B30" stroke-width="1" data-svga-color-role="badge_amber"/>
    <text x="958" y="253" text-anchor="middle" font-size="16" font-weight="600"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
