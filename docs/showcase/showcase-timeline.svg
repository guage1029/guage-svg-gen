<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="svga-showcase-timeline-title svga-showcase-timeline-desc">
  <title id="svga-showcase-timeline-title">编程智能体工程演进（2022–2026）</title>
  <desc id="svga-showcase-timeline-desc">纸白底配合 40 像素淡暖灰线网与同底遮罩展示编程智能体从行级补全到契约驱动自治交付的四阶段跨越。</desc>

  <defs>
    <pattern id="svga-showcase-timeline-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 39.5 0 L 39.5 40 M 0 39.5 L 40 39.5" fill="none" stroke="#D6D2C9" stroke-width="1" stroke-opacity="0.48" data-svga-role="decoration" data-svga-color-role="grid"/>
    </pattern>
    <marker id="svga-showcase-timeline-arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#78716C" data-svga-role="decoration" data-svga-color-role="edge_neutral"/>
    </marker>
    <marker id="svga-showcase-timeline-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#4D5E9E" data-svga-role="decoration" data-svga-color-role="edge_flow"/>
    </marker>
    <marker id="svga-showcase-timeline-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#387D64" data-svga-role="decoration" data-svga-color-role="edge_green"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#F7F5F0" data-svga-color-role="background"/>
  <rect x="0" y="0" width="1200" height="675" fill="url(#svga-showcase-timeline-grid)" data-svga-role="decoration"/>
  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#CCC7BD" stroke-width="2" data-svga-role="decoration" data-svga-color-role="border"/>

  <!-- Pre-Edge Label Halos -->
  <g id="svga-showcase-timeline-halos" data-svga-role="decoration">
    <rect x="330" y="50" width="540" height="44" rx="6" fill="#F7F5F0" data-svga-color-role="background"/>
    <rect x="300" y="100" width="600" height="28" rx="6" fill="#F7F5F0" data-svga-color-role="background"/>
    <rect x="166" y="172" width="88" height="30" rx="6" fill="#F7F5F0" data-svga-color-role="background"/>
    <rect x="426" y="172" width="88" height="30" rx="6" fill="#F7F5F0" data-svga-color-role="background"/>
    <rect x="686" y="172" width="88" height="30" rx="6" fill="#F7F5F0" data-svga-color-role="background"/>
    <rect x="946" y="172" width="88" height="30" rx="6" fill="#F7F5F0" data-svga-color-role="background"/>
    <rect x="128" y="582" width="944" height="34" rx="6" fill="#F7F5F0" data-svga-color-role="background"/>
    <line x1="96" y1="188" x2="1104" y2="188" stroke="#CCC7BD" stroke-width="1" stroke-dasharray="4,4" data-svga-color-role="border"/>
  </g>

  <g id="svga-showcase-timeline-header">
    <text x="600" y="84" text-anchor="middle" font-size="32" font-weight="800"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#09090B" data-svga-color-role="text_primary" data-svga-text="main-title">编程智能体工程演进（2022–2026）</text>
    <text x="600" y="120" text-anchor="middle" font-size="18" font-weight="400"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="sub-title">从行级片段补全助手向自主沙箱验证交付系统的四阶段跨越</text>
  </g>

  <text x="210" y="194" text-anchor="middle" font-size="17" font-weight="700"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="stage-1-lbl">阶段 01</text>
  <text x="470" y="194" text-anchor="middle" font-size="17" font-weight="700"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#3D4C87" data-svga-color-role="text_blue" data-svga-text="stage-2-lbl">阶段 02</text>
  <text x="730" y="194" text-anchor="middle" font-size="17" font-weight="700"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#2A634E" data-svga-color-role="text_green" data-svga-text="stage-3-lbl">阶段 03</text>
  <text x="990" y="194" text-anchor="middle" font-size="17" font-weight="700"
        font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
        fill="#7F5420" data-svga-color-role="text_amber" data-svga-text="stage-4-lbl">阶段 04</text>

  <path d="M 324 372 L 356 372" fill="none" stroke="#78716C" stroke-width="2.5"
        marker-end="url(#svga-showcase-timeline-arrow-neutral)"
        data-svga-edge="edge-1-2" data-svga-role="edge" data-svga-color-role="edge_neutral"/>
  <path d="M 584 372 L 616 372" fill="none" stroke="#4D5E9E" stroke-width="2.5"
        marker-end="url(#svga-showcase-timeline-arrow-blue)"
        data-svga-edge="edge-2-3" data-svga-role="edge" data-svga-color-role="edge_flow"/>
  <path d="M 844 372 L 876 372" fill="none" stroke="#387D64" stroke-width="2.5"
        marker-end="url(#svga-showcase-timeline-arrow-green)"
        data-svga-edge="edge-3-4" data-svga-role="edge" data-svga-color-role="edge_green"/>

  <g id="svga-showcase-timeline-m1" data-svga-node="m-1">
