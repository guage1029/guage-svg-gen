          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m1-badge">2022 · 补全期</text>
    <text x="110" y="298" font-size="20" font-weight="700" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#09090B" data-svga-color-role="text_primary" data-svga-text="m1-title">行级代码自动补全</text>
    <text x="110" y="332" font-size="17" font-weight="600" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#52525B" data-svga-color-role="text_muted" data-svga-text="m1-sub">编辑器内联预测辅助</text>
    <line x1="110" y1="344" x2="310" y2="344" stroke="#CCC7BD" stroke-width="1" data-svga-color-role="border"/>
    <text x="110" y="376" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m1-b1">· 基于光标上下文续写</text>
    <text x="110" y="418" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m1-b2">· 局限于单文件短窗口</text>
    <text x="110" y="460" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m1-b3">· 需人工粘贴并运行测试</text>
  </g>

  <g id="svga-showcase-timeline-m2" data-svga-node="m-2">
    <rect x="356" y="218" width="228" height="308" rx="10" fill="#FFFFFF" stroke="#4D5E9E" stroke-width="1.5" data-svga-color-role="node"/>
    <rect x="370" y="234" width="136" height="28" rx="14" fill="#EEF1FA" stroke="#4D5E9E" stroke-width="1" data-svga-color-role="badge_blue"/>
    <text x="438" y="253" text-anchor="middle" font-size="16" font-weight="600"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3D4C87" data-svga-color-role="text_blue" data-svga-text="m2-badge">2023 · 对话期</text>
    <text x="370" y="298" font-size="20" font-weight="700" text-anchor="start"
