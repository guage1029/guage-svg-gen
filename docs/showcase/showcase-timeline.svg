    <text x="370" y="332" font-size="17" font-weight="600" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3D4C87" data-svga-color-role="text_blue" data-svga-text="m2-sub">仓库检索与差异生成</text>
    <line x1="370" y1="344" x2="570" y2="344" stroke="#CCC7BD" stroke-width="1" data-svga-color-role="border"/>
    <text x="370" y="376" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m2-b1">· 跨文件引用问答与重构</text>
    <text x="370" y="418" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m2-b2">· 代码索引召回相关模块</text>
    <text x="370" y="460" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_secondary" data-svga-text="m2-b3">· 人工把关构建与回滚</text>
  </g>

