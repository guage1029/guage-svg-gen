<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1200" height="500" fill="#000000" rx="8" />
  
  <defs>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 核心结构组：垂直居中重排 -->
  <!-- 1. 核心源：Shared Repo (超级放大) -->
  <g transform="translate(600, 420)">
    <circle r="24" fill="#FFFFFF" filter="url(#strongGlow)" />
    <text y="60" text-anchor="middle" fill="#94A3B8" style="font-family:'SF Mono', monospace; font-size:28px; font-weight:800; letter-spacing:4px;">SHARED .GIT</text>
  </g>

  <!-- 连接线 (精准对接 + 视觉强化) -->
  <g opacity="0.6">
    <path d="M600 396 C600 320 350 320 350 255" fill="none" stroke="#3B82F6" stroke-width="8" />
    <path d="M600 396 C600 320 850 320 850 255" fill="none" stroke="#A855F7" stroke-width="8" />
  </g>

  <!-- 2. 左侧：Human Workspace (超级放大) -->
  <g transform="translate(350, 180)">
    <rect x="-200" y="-75" width="400" height="150" rx="75" fill="none" stroke="#3B82F6" stroke-width="4" />
    <text text-anchor="middle" y="15" fill="#FFFFFF" style="font-family:'PingFang SC', sans-serif; font-size:42px; font-weight:700;">Main (Human)</text>
  </g>

  <!-- 3. 右侧：AI Worktree (超级放大 + 强光) -->
  <g transform="translate(850, 180)">
    <rect x="-200" y="-75" width="400" height="150" rx="75" fill="#1E1B4B" stroke="#A855F7" stroke-width="5" filter="url(#strongGlow)" />
    <text text-anchor="middle" y="15" fill="#FFFFFF" style="font-family:'PingFang SC', sans-serif; font-size:42px; font-weight:900;">Worktree (AI)</text>
  </g>
</svg>
