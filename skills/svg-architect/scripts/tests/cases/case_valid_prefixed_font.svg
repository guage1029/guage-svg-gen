<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <title>Valid Prefixed Font</title>
  <desc>All IDs prefixed, font-family with fallback, font-size above minimum</desc>
  <defs>
    <linearGradient id="svga-test-bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect id="svga-test-bg" width="1200" height="500" fill="url(#svga-test-bg-grad)"/>
  <rect id="svga-test-card" x="60" y="60" width="1080" height="380" rx="16" fill="#1e1e2e"/>
  <text id="svga-test-title" x="600" y="230" text-anchor="middle" fill="#ffffff" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="48">Valid SVG</text>
  <text id="svga-test-sub" x="600" y="290" text-anchor="middle" fill="#aaaacc" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="24">All checks pass</text>
</svg>
