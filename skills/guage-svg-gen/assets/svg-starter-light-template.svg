<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="675"
     viewBox="0 0 1200 675"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="svga-starter-light-title svga-starter-light-desc">
  <title id="svga-starter-light-title">系统核心架构模板（纸白 16:9）</title>
  <desc id="svga-starter-light-desc">展示默认 16:9 纸感白底、纯白实体卡片、25 像素对齐暖灰网格、四级圆角、虚线区、正交连线与单像素贴边外框的浅色起手模版。</desc>

  <defs>
    <pattern id="svga-starter-light-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 24 25 M 0 24 L 25 24"
            fill="none"
            stroke="#D6D2C9"
            stroke-width="1.5"
            stroke-opacity="0.55"
            data-svga-role="decoration"
            data-svga-color-role="grid"/>
    </pattern>

    <marker id="svga-starter-light-arrow-blue"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z"
            fill="#2563EB"
            data-svga-role="decoration"
            data-svga-color-role="edge_flow"/>
    </marker>

    <marker id="svga-starter-light-arrow-purple"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="8"
            markerHeight="8"
            markerUnits="userSpaceOnUse"
            orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z"
            fill="#7C3AED"
            data-svga-role="decoration"
            data-svga-color-role="edge_data"/>
    </marker>
  </defs>

  <!-- 1. Flat Paper Background, Pixel-Snapped 25px Warm-Gray Grid, and 1px Clipped Outer Border -->
  <rect x="0" y="0" width="1200" height="675"
        fill="#F7F5F0"
        data-svga-color-role="background"/>
  <rect x="0" y="0" width="1200" height="675"
        fill="url(#svga-starter-light-grid)"
        data-svga-role="decoration"/>
  <rect x="0" y="0" width="1200" height="675"
        fill="none"
        stroke="#CCC7BD"
        stroke-width="2"
        data-svga-role="decoration"
        data-svga-color-role="border"/>

  <!-- 2. Header -->
  <g id="svga-starter-light-header">
    <text x="600" y="88"
          text-anchor="middle"
          font-size="34"
          font-weight="800"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#09090B"
          data-svga-color-role="text_primary"
          data-svga-text="main-title">系统核心架构模板</text>

    <text x="600" y="120"
          text-anchor="middle"
          font-size="16"
          font-weight="500"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B"
          data-svga-color-role="text_secondary"
          data-svga-text="sub-title">默认 16:9 纸白画幅 · 25 像素暖灰网格 · 四级圆角 · 单像素收口</text>
  </g>

  <!-- 3. External Legend (Outside all zones, >= 20px clear) -->
  <g id="svga-starter-light-legend">
    <line x1="150" y1="602" x2="186" y2="602"
          stroke="#2563EB" stroke-width="2.5"
          data-svga-role="decoration" data-svga-color-role="edge_flow"/>
    <text x="194" y="608" font-size="16" font-weight="400"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B" data-svga-color-role="text_secondary"
          data-svga-text="legend-flow">主链路实线</text>

    <line x1="320" y1="602" x2="356" y2="602"
          stroke="#7C3AED" stroke-width="2" stroke-dasharray="5,5"
          data-svga-role="decoration" data-svga-color-role="edge_data"/>
    <text x="364" y="608" font-size="16" font-weight="400"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B" data-svga-color-role="text_secondary"
          data-svga-text="legend-async">异步虚线 (5,5)</text>

    <rect x="520" y="594" width="22" height="16" rx="4"
          fill="none" stroke="#78716C" stroke-width="1.5" stroke-dasharray="4,3"
          data-svga-role="decoration" data-svga-color-role="zone_border"/>
    <text x="550" y="608" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B" data-svga-color-role="text_secondary"
          data-svga-text="legend-zone"><tspan>虚线域 </tspan><tspan font-family="JetBrains Mono, monospace" data-svga-text-kind="code">rx=12</tspan></text>

    <text x="714" y="608" font-size="16" font-weight="500" text-anchor="start"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_muted"
          data-svga-text="legend-radius">圆角层级：12 / 10 / 8 / 全圆角</text>
  </g>

  <!-- 4. Dashed Zone Container (Drawn before edges & nodes; rx=12, fill=none keeps grid uniform) -->
  <g id="svga-starter-light-zone-core" data-svga-zone="zone-core">
    <rect x="96" y="148" width="1008" height="212" rx="12"
          fill="none"
          stroke="#78716C" stroke-width="1.5" stroke-dasharray="8,4"
          data-svga-color-role="zone_border"/>
    <text x="116" y="175" font-size="16" font-weight="600" text-anchor="start"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_muted"
          data-svga-text="zone-core-label"><tspan>核心处理域（虚线区 </tspan><tspan font-family="JetBrains Mono, monospace" data-svga-text-kind="code">rx=12</tspan><tspan>）</tspan></text>
  </g>

  <!-- 5. Connectors Layer -->
  <path d="M 540 265 L 660 265"
        fill="none"
        stroke="#2563EB"
        stroke-width="2.5"
        marker-end="url(#svga-starter-light-arrow-blue)"
        data-svga-edge="edge-1-2"
        data-svga-role="edge"
        data-svga-color-role="edge_flow"/>
  <text x="600" y="246" text-anchor="middle" font-size="16" font-weight="600"
        font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
        fill="#1E40AF" data-svga-color-role="text_blue"
        data-svga-text="edge-label-12">同步调用</text>

  <path d="M 870 336 L 870 444"
        fill="none"
        stroke="#7C3AED"
        stroke-width="2"
        stroke-dasharray="5,5"
        marker-end="url(#svga-starter-light-arrow-purple)"
        data-svga-edge="edge-async-2"
        data-svga-role="edge"
        data-svga-color-role="edge_data"/>
  <text x="886" y="408" text-anchor="start" font-size="16" font-weight="500"
        font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
        fill="#5B21B6" data-svga-color-role="text_purple"
        data-svga-text="edge-label-async">异步事件</text>

  <!-- 6. Foreground Primary Cards (rx=10, opaque #FFFFFF backing) + Pills (rx=13) -->
  <g id="svga-starter-light-stage-1" data-svga-node="stage-1">
    <rect x="120" y="194" width="420" height="142" rx="10"
          fill="#FFFFFF"
          stroke="#CCC7BD"
          stroke-width="1.5"
          data-svga-color-role="node"/>
    <text x="140" y="229"
          font-size="20"
          font-weight="700"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#09090B"
          data-svga-color-role="text_primary"
          data-svga-text="s1-title"><tspan>接入层（</tspan><tspan font-family="JetBrains Mono, monospace" data-svga-text-kind="professional_term">Gateway</tspan><tspan>）</tspan></text>
    <rect x="432" y="210" width="88" height="26" rx="13"
          fill="#EFECE4" stroke="#CCC7BD" stroke-width="1"
          data-svga-color-role="badge_neutral"/>
    <text x="476" y="228" text-anchor="middle" font-size="16" font-weight="600"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_muted"
          data-svga-text="s1-badge">入口网关</text>
    <text x="140" y="270" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_muted"
          data-svga-text="s1-desc-1"><tspan>主卡片圆角 </tspan><tspan font-family="JetBrains Mono, monospace" data-svga-text-kind="code" fill="#2563EB">rx=10</tspan><tspan> · 纯白底托防穿线</tspan></text>
    <text x="140" y="306" font-size="16" font-weight="400"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B" data-svga-color-role="text_secondary"
          data-svga-text="s1-desc-2">纯白实体表面与清晰暖灰边框层次</text>
  </g>

  <g id="svga-starter-light-stage-2" data-svga-node="stage-2">
    <rect x="660" y="194" width="420" height="142" rx="10"
          fill="#FFFFFF"
          data-svga-color-role="node"/>
    <rect x="660" y="194" width="420" height="142" rx="10"
          fill="#FFFFFF"
          stroke="#2563EB"
          stroke-width="1.5"
          data-svga-color-role="node_focus"/>
    <text x="680" y="229"
          font-size="20"
          font-weight="700"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#09090B"
          data-svga-color-role="text_primary"
          data-svga-text="s2-title">核心服务引擎</text>
    <rect x="972" y="210" width="88" height="26" rx="13"
          fill="#DBEAFE" stroke="#2563EB" stroke-width="1"
          data-svga-color-role="badge_blue"/>
    <text x="1016" y="228" text-anchor="middle" font-size="16" font-weight="600"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#1E40AF" data-svga-color-role="text_blue"
          data-svga-text="s2-badge">核心服务</text>
    <text x="680" y="270" font-size="16" font-weight="400"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#3F3F46" data-svga-color-role="text_muted"
          data-svga-text="s2-desc-1">焦点卡片使用高对比强调边框</text>
    <text x="680" y="306" font-size="16" font-weight="400" text-anchor="start"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B" data-svga-color-role="text_secondary"
          data-svga-text="s2-desc-2"><tspan>右上角徽章采用半高全圆角 </tspan><tspan font-family="JetBrains Mono, monospace" data-svga-text-kind="code" fill="#2563EB">rx=13</tspan></text>
  </g>

  <!-- 7. Secondary Layer Cards (Outside zone, rx=8) -->
  <g id="svga-starter-light-sub-1" data-svga-node="sub-1">
    <rect x="120" y="444" width="420" height="96" rx="8"
          fill="#EFECE4"
          stroke="#CCC7BD"
          stroke-width="1.2"
          data-svga-color-role="node_secondary"/>
    <text x="140" y="479" font-size="16" font-weight="600" text-anchor="start"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#09090B" data-svga-color-role="text_primary"
          data-svga-text="sub1-title"><tspan>配置与缓存（次级卡 </tspan><tspan font-family="JetBrains Mono, monospace" data-svga-text-kind="code" fill="#1E40AF">rx=8</tspan><tspan>）</tspan></text>
    <text x="140" y="514" font-size="16" font-weight="400"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B" data-svga-color-role="text_secondary"
          data-svga-text="sub1-desc">用于附属模块、底层存储或独立清单卡</text>
  </g>

  <g id="svga-starter-light-sub-2" data-svga-node="sub-2">
    <rect x="660" y="444" width="420" height="96" rx="8"
          fill="#EFECE4"
          stroke="#CCC7BD"
          stroke-width="1.2"
          data-svga-color-role="node_secondary"/>
    <text x="680" y="479" font-size="16" font-weight="600" text-anchor="start"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#09090B" data-svga-color-role="text_primary"
          data-svga-text="sub2-title"><tspan>异步审计与日志（虚线 </tspan><tspan font-family="JetBrains Mono, monospace" data-svga-text-kind="code" fill="#5B21B6">5,5</tspan><tspan>）</tspan></text>
    <text x="680" y="514" font-size="16" font-weight="400"
          font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, system-ui, sans-serif"
          fill="#52525B" data-svga-color-role="text_secondary"
          data-svga-text="sub2-desc">沿正交端口回传事件与审计记录</text>
  </g>
</svg>
