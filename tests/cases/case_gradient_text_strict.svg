  <rect width="1200" height="500" fill="#0a0a0b"/>
  <text id="svga-t-1" x="100" y="200" fill="url(#svga-test-grad)" font-family="PingFang SC, sans-serif" font-size="48">Gradient Text</text>
</svg>
